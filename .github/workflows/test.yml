name: Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test requirements
        run: python -m pip install -r requirements-test.txt
      - name: Python tests
        run: python -m pytest -q
      - name: Validate Python and JSON
        run: |
          python -m compileall -q custom_components tests
          python -c "import json, pathlib; [json.loads(f.read_text()) for f in pathlib.Path('custom_components/infuse').rglob('*.json')]"
      - name: Validate dashboard JavaScript
        run: |
          node --check custom_components/infuse/www/infuse-dashboard-cards.js
          node --test tests/test_now_playing_card.mjs tests/test_household_card.mjs

  real-home-assistant:
    name: Real Home Assistant smoke tests (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install isolated Home Assistant test environment
        run: |
          uv venv --python 3.14 .venv-ha
          uv pip install --python .venv-ha/bin/python -r requirements-test-ha.txt
      - name: Exercise real Home Assistant config entries and entities
        run: .venv-ha/bin/python -m pytest tests_ha -q
