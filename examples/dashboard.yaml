title: Infuse
views:
  - title: Now Playing
    path: now-playing
    icon: mdi:play-circle-outline
    cards:
      - type: custom:infuse-now-playing-card
        entity: media_player.infuse_wohnzimmer
        # Optional bottom tiles (all true by default):
        show_status: true
        show_progress: true
        show_remaining: false
      - type: entities
        title: Playback details
        entities:
          - media_player.infuse_wohnzimmer
          - sensor.infuse_wohnzimmer_progress
          - sensor.infuse_wohnzimmer_time_remaining
